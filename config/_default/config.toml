# Change baseurl before deploy
baseurl = "https://waldflaufer.github.io"
languageCode = "en-us"
title        = "Christina Junger"
#subtitel = "Ancora Imparo – Embark with me on a journey of ideas, experiments, and creative projects."

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

# Change it to your Disqus shortname before using
# Kein Disqus mehr – Kommentare sind in params.toml deaktiviert.
# (Der frühere Wert "hugo-theme-stack" war der Demo-Account des Theme-Autors.)

[pagination]
    pagerSize = 6


